{% extends 'hostelapp/base.html' %}
{% block page_title %}Delete Staff{% endblock %}
{% block content %}

<div style="max-width:480px;margin:0 auto;">
    <div style="background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:32px;text-align:center;">
        <div style="font-size:3rem;margin-bottom:16px;">⚠️</div>
        <h4 style="font-weight:800;color:#1a1a2e;margin-bottom:8px;">Delete Staff Member?</h4>
        <p style="color:#6c757d;font-size:0.88rem;margin-bottom:24px;">
            Are you sure you want to delete <strong>{{ staff.user.get_full_name }}</strong>?
            This action cannot be undone.
        </p>
        <div style="display:flex;gap:12px;justify-content:center;">
            <a href="{% url 'staff_list' %}"
               style="background:#f0f4ff;color:#0f3460;padding:10px 24px;border-radius:10px;text-decoration:none;font-weight:700;font-size:0.88rem;">
                Cancel
            </a>
            <form method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit"
                    style="background:#e94560;color:#fff;border:none;padding:10px 24px;border-radius:10px;font-weight:700;font-size:0.88rem;cursor:pointer;">
                    Yes, Delete
                </button>
            </form>
        </div>
    </div>
</div>

<style>
@media (max-width: 768px) {
    [style*="max-width:480px"] { max-width: 100% !important; }
}
</style>
{% endblock %}
