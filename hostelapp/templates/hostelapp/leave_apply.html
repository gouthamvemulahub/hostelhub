{% extends 'hostelapp/base.html' %}
{% block page_title %}Apply for Leave
<style>
@media (max-width: 768px) {
    [style*="max-width"] { max-width: 100% !important; width: 100% !important; }
    [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    [style*="display:grid"] { grid-template-columns: 1fr !important; }
    [style*="display:flex"] { flex-wrap: wrap !important; }
    table { min-width: 500px; }
    .table-wrap, div:has(> table) { overflow-x: auto !important; }
    input, select, textarea { font-size: 16px !important; }
    [style*="padding:36px"], [style*="padding:40px"], [style*="padding:44px"],
    [style*="padding:48px"], [style*="padding:32px"] { padding: 16px !important; }
    [style*="padding:28px"] { padding: 14px 12px !important; }
    [style*="font-size:1.8rem"], [style*="font-size:2rem"], [style*="font-size:2.2rem"] { font-size: 1.3rem !important; }
    [style*="gap:20px"], [style*="gap:24px"] { gap: 12px !important; }
}
</style>
{% endblock %}
{% block content %}

<div style="max-width:600px;margin:0 auto;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <a href="{% url 'leave_list' %}" style="color:#e94560;text-decoration:none;font-size:1.2rem;">←</a>
        <h4 style="font-weight:800;color:#1a1a2e;margin:0;">🗓️ Apply for Leave</h4>
    </div>

    {% for message in messages %}
    <div style="padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:0.85rem;
        background:rgba(233,69,96,0.1);color:#e94560;border:1px solid rgba(233,69,96,0.2);">
        {{ message }}
    </div>
    {% endfor %}

    <div style="background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:32px;">
        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom:20px;">
                <label style="font-weight:700;font-size:0.82rem;color:#444;margin-bottom:8px;display:block;">Leave Type</label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    {% for val, label in leave_types %}
                    <label style="cursor:pointer;">
                        <input type="radio" name="leave_type" value="{{ val }}" style="display:none;" required
                               onchange="selectLeaveType(this)">
                        <div class="type-card" style="border:2px solid #e0e0e0;border-radius:12px;padding:14px;text-align:center;transition:all 0.2s;">
                            <div style="font-size:1.4rem;margin-bottom:4px;">
                                {% if val == 'home' %}🏠{% elif val == 'medical' %}🏥{% elif val == 'emergency' %}🚨{% elif val == 'festival' %}🎉{% else %}📋{% endif %}
                            </div>
                            <div style="font-size:0.82rem;font-weight:600;color:#1a1a2e;">{{ label }}</div>
                        </div>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
                <div>
                    <label style="font-weight:700;font-size:0.82rem;color:#444;margin-bottom:6px;display:block;">From Date</label>
                    <input type="date" name="from_date" class="form-control" required
                           min="{% now 'Y-m-d' %}" onchange="updateDays()">
                </div>
                <div>
                    <label style="font-weight:700;font-size:0.82rem;color:#444;margin-bottom:6px;display:block;">To Date</label>
                    <input type="date" name="to_date" class="form-control" required
                           min="{% now 'Y-m-d' %}" onchange="updateDays()">
                </div>
            </div>

            <!-- Days counter -->
            <div id="daysCounter" style="display:none;background:#f0f4ff;border-radius:8px;padding:10px 16px;margin-bottom:20px;font-size:0.85rem;font-weight:600;color:#0f3460;">
                📅 Total Leave Days: <span id="daysCount">0</span>
            </div>

            <div style="margin-bottom:24px;">
                <label style="font-weight:700;font-size:0.82rem;color:#444;margin-bottom:6px;display:block;">Reason for Leave</label>
                <textarea name="reason" class="form-control" rows="4"
                          placeholder="Explain the reason for your leave request..." required></textarea>
            </div>

            <div style="display:flex;gap:12px;">
                <button type="submit"
                    style="background:#e94560;color:#fff;border:none;border-radius:10px;
                           padding:12px 28px;font-weight:700;font-size:0.9rem;cursor:pointer;">
                    📤 Submit Leave Request
                </button>
                <a href="{% url 'leave_list' %}"
                   style="background:#f0f4ff;color:#1a1a2e;border-radius:10px;padding:12px 20px;
                          font-weight:600;font-size:0.9rem;text-decoration:none;display:inline-block;">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<style>
.type-card.selected { border-color: #e94560 !important; background: #fff5f7; }
.type-card:hover { border-color: #e94560; }
</style>

<script>
function selectLeaveType(radio) {
    // Remove selected from all cards
    document.querySelectorAll('.type-card').forEach(function(card) {
        card.classList.remove('selected');
        card.style.borderColor = '#e0e0e0';
        card.style.background  = '#fff';
    });
    // Add selected to clicked card
    var card = radio.parentElement.querySelector('.type-card');
    card.classList.add('selected');
    card.style.borderColor = '#e94560';
    card.style.background  = '#fff5f7';
}

function updateDays() {
    var from = document.querySelector('[name=from_date]').value;
    var to   = document.querySelector('[name=to_date]').value;
    if (from && to) {
        var diff = (new Date(to) - new Date(from)) / (1000 * 60 * 60 * 24) + 1;
        if (diff > 0) {
            document.getElementById('daysCount').textContent = diff;
            document.getElementById('daysCounter').style.display = 'block';
        }
    }
}
</script>
{% endblock %}
