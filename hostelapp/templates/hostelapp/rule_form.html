{% extends 'hostelapp/base.html' %}
{% block page_title %}{{ title }}
<style>
@media (max-width: 768px) {
    [style*="max-width"] { max-width: 100% !important; width: 100% !important; }
    [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    [style*="display:grid"] { grid-template-columns: 1fr !important; }
    [style*="display:flex"] { flex-wrap: wrap !important; }
    table { min-width: 500px; }
    .table-wrap, div:has(> table) { overflow-x: auto !important; }
    input, select, textarea { font-size: 16px !important; }
    [style*="padding:36px"], [style*="padding:40px"], [style*="padding:44px"],
    [style*="padding:48px"], [style*="padding:32px"] { padding: 16px !important; }
    [style*="padding:28px"] { padding: 14px 12px !important; }
    [style*="font-size:1.8rem"], [style*="font-size:2rem"], [style*="font-size:2.2rem"] { font-size: 1.3rem !important; }
    [style*="gap:20px"], [style*="gap:24px"] { gap: 12px !important; }
}
</style>
{% endblock %}
{% block content %}

<div style="max-width:600px;margin:0 auto;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <a href="{% url 'rules_list' %}" style="color:#e94560;text-decoration:none;font-size:1.2rem;">←</a>
        <h4 style="font-weight:800;color:#1a1a2e;margin:0;">{{ title }}</h4>
    </div>

    <div style="background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:32px;">
        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom:20px;">
                <label style="font-weight:700;font-size:0.82rem;color:#444;margin-bottom:6px;display:block;">Category</label>
                <select name="category" class="form-control" required>
                    <option value="">— Select Category —</option>
                    {% for cat, label, icon in categories %}
                    <option value="{{ cat }}" {% if rule.category == cat %}selected{% endif %}>
                        {{ icon }} {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-weight:700;font-size:0.82rem;color:#444;margin-bottom:6px;display:block;">Rule Title</label>
                <input type="text" name="title" class="form-control"
                       value="{{ rule.title|default:'' }}"
                       placeholder="e.g. Gate closing time is 10 PM" required>
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-weight:700;font-size:0.82rem;color:#444;margin-bottom:6px;display:block;">Description</label>
                <textarea name="description" class="form-control" rows="4"
                          placeholder="Explain the rule in detail..." required>{{ rule.description|default:'' }}</textarea>
            </div>

            <div style="margin-bottom:28px;">
                <label style="font-weight:700;font-size:0.82rem;color:#444;margin-bottom:6px;display:block;">
                    Display Order <span style="color:#aaa;font-weight:400;">(lower number shows first)</span>
                </label>
                <input type="number" name="order" class="form-control"
                       value="{{ rule.order|default:'0' }}" min="0" style="width:120px;">
            </div>

            <div style="display:flex;gap:12px;">
                <button type="submit"
                    style="background:#e94560;color:#fff;border:none;border-radius:10px;
                           padding:12px 28px;font-weight:700;font-size:0.9rem;cursor:pointer;">
                    💾 Save Rule
                </button>
                <a href="{% url 'rules_list' %}"
                   style="background:#f0f4ff;color:#1a1a2e;border-radius:10px;padding:12px 20px;
                          font-weight:600;font-size:0.9rem;text-decoration:none;display:inline-block;">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
