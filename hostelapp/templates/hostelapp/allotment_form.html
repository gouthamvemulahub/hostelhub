{% extends 'hostelapp/base.html' %}
{% block page_title %}New Room Allotment
<style>
@media (max-width: 768px) {
    [style*="max-width"] { max-width: 100% !important; width: 100% !important; }
    [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    [style*="display:grid"] { grid-template-columns: 1fr !important; }
    [style*="display:flex"] { flex-wrap: wrap !important; }
    table { min-width: 500px; }
    input, select, textarea { font-size: 16px !important; }
    .col-md-4, .col-md-6, .col-lg-8 { padding: 4px 0; }
    .card { margin-bottom: 12px; }
}
</style>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">Allot Room to Student</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label">Student</label>
                        {{ form.student }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Room (Available Only)</label>
                        {{ form.room }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Remarks</label>
                        {{ form.remarks }}
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'allotment_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Allot Room</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
