{% extends 'hostelapp/base.html' %}
{% block public_content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | HostelHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family:'Sora',sans-serif; background:#f8f9ff; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .auth-card { background:#fff; border-radius:20px; padding:48px; max-width:440px; width:100%; box-shadow:0 4px 40px rgba(0,0,0,0.08); }
        .brand { text-align:center; margin-bottom:28px; }
        .brand h2 { font-weight:800; font-size:1.8rem; letter-spacing:-1px; }
        .brand span { color:#e94560; }
        .icon-wrap { width:72px;height:72px;background:rgba(233,69,96,0.1);border:2px solid rgba(233,69,96,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 16px; }
        .form-control { border:1px solid #e0e0e0;border-radius:10px;padding:12px 16px;font-size:0.9rem;font-family:'Sora',sans-serif; }
        .form-control:focus { border-color:#e94560;box-shadow:0 0 0 3px rgba(233,69,96,0.1); }
        .form-label { font-weight:600;font-size:0.82rem;margin-bottom:6px; }
        .btn-main { background:#e94560;color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:0.95rem;width:100%;font-family:'Sora',sans-serif;transition:all 0.2s; }
        .btn-main:hover { background:#c73652;transform:translateY(-1px); }
        .back-link { text-align:center;font-size:0.85rem;margin-top:20px; }
        .back-link a { color:#e94560;font-weight:600;text-decoration:none; }
        p.hint { color:#6c757d;font-size:0.85rem;text-align:center;margin-bottom:24px; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="brand">
        <div class="icon-wrap">🔐</div>
        <h2><span>Hostel</span>Hub</h2>
    </div>
    <p class="hint">Enter your registered email address and we'll send you a password reset link.</p>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="your@email.com" required autofocus>
        </div>
        <button type="submit" class="btn-main">📧 Send Reset Link</button>
    </form>
    <div class="back-link">
        <a href="{% url 'login' %}">← Back to Login</a>
    </div>
</div>
<style>
@media (max-width: 768px) {
    [style*="max-width"] { max-width: 100% !important; width: 100% !important; }
    input, select, textarea { font-size: 16px !important; }
    [style*="padding:48px"], [style*="padding:44px"] { padding: 20px !important; }
}
</style>
</body>
</html>
{% endblock %}
