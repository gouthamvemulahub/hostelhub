<!-- Export Modal — include this inside dashboard.html or base.html -->
<!-- Add {% include 'hostelapp/export_modal.html' %} anywhere in your template -->

<!-- Floating Export Button -->
<div style="position:fixed;bottom:28px;right:28px;z-index:1000;">
    <button onclick="document.getElementById('exportModal').style.display='flex'"
        style="background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;border:none;
               border-radius:50px;padding:14px 24px;font-weight:700;font-size:0.9rem;
               box-shadow:0 4px 20px rgba(0,0,0,0.3);cursor:pointer;
               display:flex;align-items:center;gap:8px;transition:all 0.2s;"
        onmouseover="this.style.transform='translateY(-2px)'"
        onmouseout="this.style.transform='translateY(0)'">
        <span style="font-size:1.1rem;">📥</span> Export Data
    </button>
</div>

<!-- Modal Overlay -->
<div id="exportModal"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
            z-index:9999;align-items:center;justify-content:center;padding:20px;"
     onclick="if(event.target===this) this.style.display='none'">

    <div style="background:#fff;border-radius:20px;padding:36px;width:100%;max-width:520px;
                box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:slideUp 0.2s ease;">

        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
            <div>
                <h4 style="font-weight:800;color:#1a1a2e;margin:0;">📥 Export Data</h4>
                <p style="color:#6c757d;font-size:0.82rem;margin:4px 0 0;">Choose what to export and in which format</p>
            </div>
            <button onclick="document.getElementById('exportModal').style.display='none'"
                style="background:#f0f4ff;border:none;border-radius:50%;width:36px;height:36px;
                       font-size:1.1rem;cursor:pointer;color:#6c757d;">✕</button>
        </div>

        <!-- Step 1: Data Type -->
        <p style="font-weight:700;font-size:0.82rem;color:#1a1a2e;margin-bottom:12px;letter-spacing:0.5px;">
            STEP 1 — SELECT DATA
        </p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;">
            {% for choice in export_choices %}
            <label style="cursor:pointer;">
                <input type="radio" name="export_type" value="{{ choice.val }}"
                       {% if forloop.first %}checked{% endif %}
                       style="display:none;" onchange="updateExportBtn()">
                <div class="export-option" data-val="{{ choice.val }}"
                     style="border:2px solid #e0e0e0;border-radius:12px;padding:14px;
                            display:flex;align-items:center;gap:10px;transition:all 0.2s;
                            {% if forloop.first %}border-color:#e94560;background:#fff5f7;{% endif %}">
                    <span style="font-size:1.4rem;">{{ choice.icon }}</span>
                    <span style="font-weight:600;font-size:0.88rem;color:#1a1a2e;">{{ choice.label }}</span>
                </div>
            </label>
            {% endfor %}
        </div>

        <!-- Step 2: Format -->
        <p style="font-weight:700;font-size:0.82rem;color:#1a1a2e;margin-bottom:12px;letter-spacing:0.5px;">
            STEP 2 — SELECT FORMAT
        </p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px;">
            <label style="cursor:pointer;">
                <input type="radio" name="export_format" value="excel" checked
                       style="display:none;" onchange="updateExportBtn()">
                <div class="export-fmt" data-val="excel"
                     style="border:2px solid #e94560;background:#fff5f7;border-radius:12px;
                            padding:14px;display:flex;align-items:center;gap:10px;transition:all 0.2s;">
                    <span style="font-size:1.4rem;">📊</span>
                    <div>
                        <div style="font-weight:700;font-size:0.88rem;color:#1a1a2e;">Excel</div>
                        <div style="font-size:0.75rem;color:#6c757d;">.xlsx file</div>
                    </div>
                </div>
            </label>
            <label style="cursor:pointer;">
                <input type="radio" name="export_format" value="pdf"
                       style="display:none;" onchange="updateExportBtn()">
                <div class="export-fmt" data-val="pdf"
                     style="border:2px solid #e0e0e0;border-radius:12px;
                            padding:14px;display:flex;align-items:center;gap:10px;transition:all 0.2s;">
                    <span style="font-size:1.4rem;">📄</span>
                    <div>
                        <div style="font-weight:700;font-size:0.88rem;color:#1a1a2e;">PDF</div>
                        <div style="font-size:0.75rem;color:#6c757d;">.pdf file</div>
                    </div>
                </div>
            </label>
        </div>

        <!-- Download Button -->
        <a id="exportDownloadBtn"
           href="/export/?type=students&format=excel"
           style="display:block;text-align:center;background:linear-gradient(135deg,#e94560,#c73652);
                  color:#fff;text-decoration:none;border-radius:12px;padding:14px;
                  font-weight:700;font-size:0.95rem;transition:all 0.2s;"
           onmouseover="this.style.opacity='0.9'"
           onmouseout="this.style.opacity='1'"
           onclick="document.getElementById('exportModal').style.display='none'">
            📥 Download Excel — Students
        </a>
    </div>
</div>

<style>
@keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
}
</style>

<script>
// Radio selection highlight for data type
document.querySelectorAll('input[name="export_type"]').forEach(radio => {
    radio.addEventListener('change', () => {
        document.querySelectorAll('.export-option').forEach(el => {
            el.style.borderColor = '#e0e0e0';
            el.style.background  = '#fff';
        });
        document.querySelector(`.export-option[data-val="${radio.value}"]`).style.borderColor = '#e94560';
        document.querySelector(`.export-option[data-val="${radio.value}"]`).style.background  = '#fff5f7';
        updateExportBtn();
    });
});

// Radio selection highlight for format
document.querySelectorAll('input[name="export_format"]').forEach(radio => {
    radio.addEventListener('change', () => {
        document.querySelectorAll('.export-fmt').forEach(el => {
            el.style.borderColor = '#e0e0e0';
            el.style.background  = '#fff';
        });
        document.querySelector(`.export-fmt[data-val="${radio.value}"]`).style.borderColor = '#e94560';
        document.querySelector(`.export-fmt[data-val="${radio.value}"]`).style.background  = '#fff5f7';
        updateExportBtn();
    });
});

function updateExportBtn() {
    const type   = document.querySelector('input[name="export_type"]:checked')?.value   || 'students';
    const format = document.querySelector('input[name="export_format"]:checked')?.value || 'excel';
    const labels = { students:'Students', allotments:'Allotments', complaints:'Complaints', staff:'Staff' };
    const fmtLabel = format === 'excel' ? 'Excel' : 'PDF';
    const icon     = format === 'excel' ? '📊' : '📄';
    const btn = document.getElementById('exportDownloadBtn');
    btn.href        = `/export/?type=${type}&format=${format}`;
    btn.textContent = `${icon} Download ${fmtLabel} — ${labels[type]}`;
}
</script>

<style>
@media (max-width: 768px) {
    [style*="max-width"] { max-width: 100% !important; }
    [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    [style*="display:flex"] { flex-wrap: wrap !important; }
    input, select { font-size: 16px !important; }
}
</style>
