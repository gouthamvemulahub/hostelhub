{% extends 'hostelapp/base.html' %}
{% block public_content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful | HostelHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family:'Sora',sans-serif; background:#f8f9ff; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .auth-card { background:#fff; border-radius:20px; padding:48px; max-width:440px; width:100%; box-shadow:0 4px 40px rgba(0,0,0,0.08); text-align:center; }
        .brand h2 { font-weight:800; font-size:1.8rem; letter-spacing:-1px; }
        .brand span { color:#e94560; }
        .icon-wrap { width:80px;height:80px;background:rgba(16,185,129,0.1);border:2px solid rgba(16,185,129,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 20px; }
        h4 { font-weight:700;color:#1a1a2e;margin-bottom:12px; }
        p { color:#6c757d;font-size:0.88rem; }
        .btn-main { background:#e94560;color:#fff;border:none;border-radius:10px;padding:13px 32px;font-weight:700;font-size:0.95rem;font-family:'Sora',sans-serif;text-decoration:none;display:inline-block;margin-top:24px;transition:all 0.2s; }
        .btn-main:hover { background:#c73652;color:#fff; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="brand"><h2><span>Hostel</span>Hub</h2></div>
    <div class="icon-wrap" style="margin-top:24px;">🎉</div>
    <h4>Password Reset Successful!</h4>
    <p>Your password has been changed successfully. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="btn-main">Sign In Now →</a>
</div>
<style>
@media (max-width: 768px) {
    [style*="max-width"] { max-width: 100% !important; width: 100% !important; }
    input, select, textarea { font-size: 16px !important; }
    [style*="padding:48px"], [style*="padding:44px"] { padding: 20px !important; }
}
</style>
</body>
</html>
{% endblock %}
